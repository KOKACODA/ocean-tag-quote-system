<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>海洋吊牌厂报价查询系统</title>
<style>
  :root{
    --brand:#0f6fc4; --brand-d:#0a4f8a; --brand-l:#e8f2fb;
    --ink:#1f2d3d; --muted:#6b7a8d; --line:#dde5ee;
    --bg:#f4f7fb; --card:#ffffff;
    --shadow:0 6px 20px rgba(15,111,196,.10);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Microsoft YaHei","Segoe UI",sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.5;
  }
  header.topbar{
    position:sticky; top:0; z-index:50; background:linear-gradient(120deg,var(--brand),var(--brand-d));
    color:#fff; padding:12px 18px; display:flex; align-items:center; gap:14px;
    box-shadow:0 2px 10px rgba(0,0,0,.15);
  }
  .topbar .logo{font-weight:800; font-size:18px; letter-spacing:.5px;}
  .topbar .home-btn{
    margin-left:auto; background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.4);
    color:#fff; padding:7px 14px; border-radius:8px; cursor:pointer; font-size:14px;
  }
  .topbar .home-btn:hover{background:rgba(255,255,255,.28);}
  main{max-width:1200px; margin:0 auto; padding:22px 18px 60px;}

  /* 首页 */
  .hero{
    background:linear-gradient(135deg,#0f6fc4,#0a4f8a); color:#fff;
    border-radius:18px; padding:28px 26px; box-shadow:var(--shadow); margin-bottom:22px;
  }
  .hero h1{margin:0 0 4px; color:#fff; font-size:27px;}
  .hero .slogan{opacity:.92; font-size:14px; margin-bottom:16px;}
  .hero .info-pills{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px;}
  .hero .pill{background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.32);
    padding:6px 13px; border-radius:20px; font-size:12.5px;}
  .gsearch{display:flex; gap:8px;}
  .gsearch input{
    flex:1; padding:12px 16px; border:1px solid var(--line); border-radius:10px;
    font-size:15px; background:#fff; color:#222;
  }
  .gsearch button{
    padding:12px 22px; border:none; border-radius:10px; background:#ffce3a; color:#5a3b00;
    font-size:15px; font-weight:800; cursor:pointer;
  }
  .gsearch button:hover{background:#ffc107;}

  .section-title{font-size:16px; color:var(--brand-d); margin:6px 4px 14px; font-weight:800;}

  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:16px;}
  .nav-card{
    background:var(--card); border-radius:14px; padding:16px 18px; box-shadow:var(--shadow);
    cursor:pointer; border:1px solid transparent; transition:.18s; border-left:5px solid var(--brand);
    display:flex; gap:14px; align-items:flex-start;
  }
  .nav-card:hover{transform:translateY(-3px); border-color:var(--brand);}
  .nav-card .idx{
    flex-shrink:0; width:38px; height:38px; line-height:38px; text-align:center;
    background:var(--brand-l); color:var(--brand-d); border-radius:10px; font-weight:800; font-size:16px;
  }
  .nav-card .body{flex:1; min-width:0;}
  .nav-card h3{margin:2px 0 4px; font-size:15px; line-height:1.4;}
  .nav-card p{margin:0; font-size:12px; color:var(--muted);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .tag-disc{display:inline-block; background:#ffe3e3; color:#e23b3b; border:2px solid #e23b3b;
    border-radius:14px; font-size:12px; font-weight:800; padding:1px 9px; margin-left:8px;}

  /* 表页 */
  .crumbs{font-size:13px; color:var(--muted); margin-bottom:12px;}
  .crumbs b{color:var(--brand-d);}
  .table-head{
    position:relative;
    background:var(--card); border-radius:14px 14px 0 0; padding:18px 18px 12px; box-shadow:var(--shadow);
  }
  .table-head h2{margin:0 0 4px; font-size:20px; color:var(--brand-d); padding-right:90px;}
  .table-head .sub{font-size:13px; color:var(--muted); padding-right:90px;}
  .discount-badge{
    position:absolute; top:14px; right:18px;
    display:inline-flex; align-items:center; justify-content:center;
    min-width:72px; height:72px; padding:6px 16px;
    border:4px solid #e23b3b; border-radius:50%;
    color:#e23b3b; font-weight:900; font-size:26px; line-height:1;
    background:#fff5f5; box-shadow:0 0 0 6px rgba(226,59,59,.10);
    transform:rotate(-7deg);
  }
  .toolbar{display:flex; gap:8px; margin-top:12px;}
  .toolbar input{
    flex:1; padding:10px 14px; border:1px solid var(--line); border-radius:10px; font-size:15px;
  }
  .toolbar .count{background:var(--brand-l); color:var(--brand-d); padding:10px 14px; border-radius:10px; font-size:13px; white-space:nowrap;}

  .code-jump{display:flex; flex-wrap:wrap; gap:6px; margin-top:12px;}
  .code-jump .lj-label{width:100%; font-size:12px; color:var(--muted); margin-bottom:2px;}
  .code-jump button{
    padding:6px 13px; border:1px solid var(--line); background:var(--brand-l); color:var(--brand-d);
    border-radius:8px; cursor:pointer; font-size:13px; font-weight:600;
  }
  .code-jump button:hover{background:var(--brand); color:#fff;}

  .hl-tip{font-size:12.5px; color:var(--muted); margin-top:12px; display:flex; align-items:center; flex-wrap:wrap; gap:6px;}
  .hl-clear{border:1px solid var(--line); background:#fff; color:var(--brand-d); border-radius:8px; padding:4px 12px; cursor:pointer; font-size:12px;}
  .hl-clear:hover{background:var(--brand-l);}

  .table-wrap{background:var(--card); overflow-x:auto; box-shadow:var(--shadow); border-radius:0 0 14px 14px;}
  table{border-collapse:collapse; width:100%; font-size:13px; min-width:640px;}
  thead th{
    background:var(--brand); color:#fff; padding:10px 12px; text-align:center;
    font-weight:600; white-space:nowrap; cursor:pointer; user-select:none; position:sticky; top:0;
  }
  thead th:hover{background:#0a4f8a;}
  tbody td{padding:9px 12px; border-bottom:1px solid var(--line); text-align:center; vertical-align:middle;}
  tbody tr:nth-child(even){background:#fafcff;}
  tbody tr{cursor:pointer;}
  tbody tr:hover{background:var(--brand-l);}
  td.spec{font-weight:600; color:var(--brand-d); max-width:200px;}
  .hl-spec{font-weight:600; color:var(--brand-d);}
  .sep{color:#e23b3b; font-weight:800; margin:0 2px;}
  .discount-price{color:#e23b3b; font-weight:800; margin-left:4px;}
  mark{background:#fff3a3; color:#b3410b; padding:0 2px; border-radius:3px;}

  /* 行列常驻高亮 */
  .row-hl{background:#fff3a3 !important;}
  .col-hl{background:#cfe8ff !important;}
  tr.row-hl td.col-hl{background:#ffd1dc !important;}

  @keyframes flash{0%{background:#fff3a3;}100%{background:transparent;}}
  tr.flash{animation:flash 1.4s;}

  .pager{display:flex; justify-content:space-between; gap:10px; margin-top:18px;}
  .pager a{
    flex:1; text-align:center; text-decoration:none; padding:12px; border-radius:10px;
    background:var(--card); color:var(--brand); font-weight:600; box-shadow:var(--shadow); border:1px solid var(--line);
  }
  .pager a:hover{background:var(--brand-l);}
  .pager a.disabled{visibility:hidden;}

  .notes{margin-top:14px; background:var(--card); border-radius:12px; padding:14px 18px; box-shadow:var(--shadow); font-size:13px; color:var(--muted);}
  .notes b{color:var(--ink);}
  .special{margin-top:14px;}
  .special h4{margin:0 0 6px; font-size:15px; color:var(--brand-d);}

  .no-result{padding:30px; text-align:center; color:var(--muted);}

  /* 响应式 */
  @media (max-width:680px){
    main{padding:14px 10px 50px;}
    .hero{padding:20px 16px;}
    .hero h1{font-size:21px;}
    .grid{grid-template-columns:1fr;}
    table{min-width:0; font-size:12.5px;}
    thead{display:none;}
    table, tbody, tr, td{display:block; width:100%;}
    tbody tr{background:var(--card); margin:10px 0; border-radius:12px; box-shadow:var(--shadow); border:1px solid var(--line); overflow:hidden;}
    tbody td{display:flex; justify-content:space-between; align-items:center; text-align:right; border-bottom:1px solid var(--line); padding:9px 14px;}
    tbody td:last-child{border-bottom:none;}
    tbody td::before{content:attr(data-label); font-weight:700; color:var(--brand-d); text-align:left;}
    td.spec{background:var(--brand-l);}
    .pager{flex-direction:column;}
    .discount-badge{top:8px; right:10px; min-width:56px; height:56px; font-size:20px; padding:4px 10px;}
  }

  /* 毛利计算器 */
  .calc-wrap{background:var(--card); border-radius:14px; padding:20px 22px; box-shadow:var(--shadow);}
  .calc-wrap h2{margin:0 0 4px; font-size:20px; color:var(--brand-d);}
  .calc-wrap .sub{font-size:13px; color:var(--muted); margin-bottom:16px;}
  .coef-chips{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:14px;}
  .coef-chips .clabel{width:100%; font-size:13px; color:var(--muted); margin-bottom:2px;}
  .coef-chip{
    padding:10px 24px; border:2px solid var(--line); background:#fff; color:var(--brand-d);
    border-radius:12px; cursor:pointer; font-size:16px; font-weight:800; transition:.15s;
  }
  .coef-chip:hover{border-color:var(--brand);}
  .coef-chip.active{background:var(--brand); color:#fff; border-color:var(--brand);}
  .calc-input{
    width:100%; min-height:110px; padding:12px 14px; border:1px solid var(--line); border-radius:10px;
    font-size:15px; line-height:1.5; resize:vertical; font-family:inherit; color:#222;
  }
  .calc-actions{display:flex; gap:10px; align-items:center; margin-top:12px; flex-wrap:wrap;}
  .calc-btn{
    padding:11px 28px; border:none; border-radius:10px; background:var(--brand); color:#fff;
    font-size:15px; font-weight:800; cursor:pointer;
  }
  .calc-btn:hover{background:var(--brand-d);}
  .calc-clear{
    padding:11px 18px; border:1px solid var(--line); background:#fff; color:var(--brand-d);
    border-radius:10px; cursor:pointer; font-size:14px;
  }
  .calc-hint{font-size:12.5px; color:var(--muted); margin-left:auto;}
  .calc-results{margin-top:20px;}
  .calc-summary{font-size:14px; margin-bottom:10px; color:var(--brand-d); font-weight:700;}
  .calc-list{display:grid; grid-template-columns:1fr; gap:8px;}
  .calc-item{
    display:flex; align-items:center; gap:10px; background:var(--brand-l); border-radius:10px;
    padding:10px 14px; font-size:14px;
  }
  .calc-item .orig{font-weight:700; color:var(--ink); min-width:90px;}
  .calc-item .op{color:var(--muted);}
  .calc-item .res{margin-left:auto; font-weight:800; color:#e23b3b; font-size:16px;}
  .calc-empty{padding:18px; text-align:center; color:var(--muted); background:var(--brand-l); border-radius:10px;}
  .calc-warn{color:#e23b3b; font-size:13px; margin-top:8px;}

  /* 表页快捷跳转导航 */
  .quick-nav{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:14px;}
  .quick-nav .qn-label{font-size:12.5px; color:var(--muted);}
  .quick-nav select{
    padding:8px 12px; border:1px solid var(--line); border-radius:9px; font-size:13px; background:#fff; color:var(--ink);
  }
  .quick-nav button{
    padding:8px 14px; border:1px solid var(--line); background:var(--brand-l); color:var(--brand-d);
    border-radius:9px; cursor:pointer; font-size:13px; font-weight:600;
  }
  .quick-nav button:hover{background:var(--brand); color:#fff;}
  .nav-card.calc-card{border-left-color:#f0883a;}
  .nav-card.calc-card .idx{background:#fdeee0; color:#d96f1e;}

  @media (max-width:680px){
    .coef-chip{padding:9px 18px; font-size:15px;}
    .calc-hint{margin-left:0; width:100%;}
  }
</style>
</head>
<body>

</header>
<main id="app"></main>

function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function highlight(text, kw){
  text = String(text);
  if(!kw) return esc(text);
  const re = new RegExp("("+kw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+")","gi");
  return esc(text).replace(re, "<mark>$1</mark>");
}
function isMobile(){ return window.matchMedia('(max-width:680px)').matches; }
function rowHit(r, kw){ if(!kw) return true; return r.some(c=>String(c).includes(kw)); }
function extractDiscount(sub){
  if(!sub) return "";
  const m = sub.match(/(\d+(?:\.\d+)?\s*折)/);
  return m ? m[1].replace(/\s+/g,'') : "";
}
// 折扣率：91折->0.91, 75折->0.75, 7.5折->0.75
function discRate(d){
  const m = String(d||'').match(/([\d.]+)/);
  if(!m) return 1;
  const n = parseFloat(m[1]);
  return n>=10 ? n/100 : n/10;
}
function priceOf(txt){ const m=String(txt).match(/([\d.]+)/); return m?parseFloat(m[1]):null; }
function fmtV(v){ return (Math.round(v*100)/100).toString(); }

/* 行列常驻高亮 + 折扣表折后价计算 */
function toggleRow(tr){ tr.classList.toggle('row-hl'); refreshDiscounts(); }
function toggleCol(ci){
  const tbl = document.querySelector('.table-wrap table');
  if(!tbl) return;
  const key = 'col'+ci;
  const on = tbl.dataset[key] === '1';
  tbl.querySelectorAll('tbody tr').forEach(tr=>{
    const td = tr.children[ci];
    if(td) td.classList.toggle('col-hl', !on);
  });
  tbl.dataset[key] = on ? '0' : '1';
  refreshDiscounts();
}
function clearHL(){
  document.querySelectorAll('.row-hl').forEach(e=>e.classList.remove('row-hl'));
  document.querySelectorAll('.col-hl').forEach(e=>e.classList.remove('col-hl'));
  document.querySelectorAll('.table-wrap table').forEach(t=>{ t.dataset = {}; });
  refreshDiscounts();
}
// 仅对“已被高亮的单元格 + 当前表有折扣”计算并显示【折后价】
function refreshDiscounts(){
  const tbl = document.querySelector('.table-wrap table');
  if(!tbl || currentRate===1) return;
  tbl.querySelectorAll('tbody td[data-price]').forEach(td=>{
    const rowOn = td.parentElement.classList.contains('row-hl');
    const colOn = td.classList.contains('col-hl');
    const orig = td.getAttribute('data-orig') || '';
    if(rowOn || colOn){
      const p = parseFloat(td.getAttribute('data-price'));
      const v = Math.round(p * currentRate * 100) / 100;
      td.innerHTML = esc(orig) + '<span class="discount-price">【'+fmtV(v)+'】</span>';
    } else {
      td.innerHTML = esc(orig);
    }
  });
}

function setCoef(v){
  calcCoef = v;
  const vals = [1.2,1.3,1.4];
  document.querySelectorAll('.coef-chip').forEach((c,idx)=>{
    if(Math.abs(vals[idx]-calcCoef)<1e-9) c.classList.add('active');
    else c.classList.remove('active');
  });
  if(document.getElementById('calcResults').innerHTML.trim()!=='') calcRun();
}

function fmtNum(v){ return (Math.round(v*100)/100).toString(); }

function calcRun(){
  const box = document.getElementById('calcResults');
  if(!box) return;
  const raw = document.getElementById('calcInput').value;
  const parts = raw.split(/[\s,，、+]+/).map(s=>s.trim()).filter(s=>s!=='');
  if(parts.length===0){
    box.innerHTML = `<div class="calc-empty">请输入至少一个数值</div>`;
    return;
  }
  let warn = "";
  let valid = 0;
  const items = [];
  for(const s of parts){
    const n = parseFloat(s);
    if(isNaN(n)){ warn += `“${esc(s)}” 不是有效数字，已跳过；`; continue; }
    valid++;
    items.push(n);
  }
  let sumO=0, sumR=0;
  const rows = items.map(n=>{
    const r = n*calcCoef;
    sumO += n; sumR += r;
    return `<div class="calc-item">
      <span class="orig">${fmtNum(n)}</span>
      <span class="op">× ${fmtNum(calcCoef)}</span>
      <span class="res">= ${fmtNum(r)}</span>
    </div>`;
  }).join("");
  let html = `<div class="calc-summary">共 ${valid} 个有效数值 · 系数 × ${fmtNum(calcCoef)}</div>`;
  html += `<div class="calc-list">${rows}</div>`;
  if(valid>0) html += `<div class="calc-summary" style="margin-top:12px;">合计：原值 ${fmtNum(sumO)} → 结果 ${fmtNum(sumR)}</div>`;
  if(warn) html += `<div class="calc-warn">⚠️ ${esc(warn)}</div>`;
  box.innerHTML = html;
}

function buildBody(t, kw){
  const headers = t.headers;
  let html = "";
  let shown = 0;
  for(const r of t.rows){
    if(!rowHit(r, kw)) continue;
    shown++;
    const specs = String(r[1]).split();
    const specHtml = specs.map(s=>`<span class="hl-spec">${highlight(s,kw)}</span>`).join('<span class="sep">；</span>');
    html += `<tr id="code-${esc(r[0])}" onclick="toggleRow(this)">`;
    for(let ci=0; ci<headers.length; ci++){
      const cls = (ci===1)?"spec":"";
      const isPrice = (ci!==0 && ci!==1 && headers[ci]!=="代码");
      if(isPrice){
        const p = priceOf(r[ci]);
        html += `<td class="${cls}" data-label="${esc(headers[ci])}" data-price="${p}" data-orig="${esc(r[ci])}">${highlight(r[ci],kw)}</td>`;
      } else {
        const val = (ci===1)?specHtml:highlight(r[ci],kw);
        html += `<td class="${cls}" data-label="${esc(headers[ci])}">${val}</td>`;
      }
    }
    html += "</tr>";
  }
  if(shown===0){
    html = `<tr><td colspan="${headers.length}" class="no-result">未找到匹配“${esc(kw)}”的记录</td></tr>`;
  }
  return {html, shown};
}

  let notes = (t.notes||[]).map(n=>`<li>${esc(n)}</li>`).join("");

      <div class="table-wrap"><table><thead><tr>${sh.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead>
      <tbody>${srows}</tbody></table></div></div>`;
  }

  const prev = i>0 ? `<a href="#/t/${i-1}">← 上一表（报价表 ${i}）</a>` : `<a class="disabled">← 上一表</a>`;
  const next = i<DATA.length-1 ? `<a href="#/t/${i+1}">下一表（报价表 ${i+2}）→</a>` : `<a class="disabled">下一表 →</a>`;

  document.getElementById("app").innerHTML = `
    <div class="crumbs">首页 / <b>报价表 ${i+1}</b> / 共 ${DATA.length} 张表</div>
    <div class="table-head">
      <h2>${esc(t.title)}</h2>
      <div class="sub">${esc(t.subtitle||'')}</div>
      ${disc?`<div class="discount-badge">${esc(disc)}</div>`:""}
      <div class="toolbar">
        <input id="search" placeholder="🔍 在当前表搜索关键词…" value="${esc(kwDec)}" oninput="onSearch(${i}, this.value)">
        <span class="count">${shown} / ${t.rows.length} 行（代码）</span>
      </div>
      <div class="code-jump"><span class="lj-label">代码快速跳转：</span>${jumpBtns}</div>
      <div class="hl-tip">💡 点击表头高亮整列 · 点击任意行高亮整行 · 有折扣的表高亮后自动显示【折后价】· <button class="hl-clear" onclick="clearHL()">清除高亮</button></div>
    </div>
    ${quickNavHtml(i)}
    <div class="table-wrap">
      <table><thead><tr>${headers.map((h,ci)=>`<th onclick="toggleCol(${ci})" title="点击高亮整列：${esc(h)}">${esc(h)}</th>`).join("")}</tr></thead>
      <tbody>${html}</tbody></table>
    </div>
    ${notes?`<div class="notes"><b>说明：</b><ul style="margin:6px 0 0;padding-left:20px;">${notes}</ul></div>`:''}
    ${special}
    <div class="pager">${prev}${next}</div>`;
  const s = document.getElementById("search");
  if(s && !kwDec) s.focus();
}

function jumpToCode(code){
  const el = document.getElementById("code-"+code);
  if(!el) return;
  el.scrollIntoView({behavior:"smooth", block:"center"});
  el.classList.remove("flash");
  void el.offsetWidth;
  el.classList.add("flash");
}

function onSearch(i, val){ location.hash = "#/t/"+i+(val.trim()?("/"+encodeURIComponent(val.trim())):""); }

let rsTimer = null;
window.addEventListener("resize", ()=>{
  clearTimeout(rsTimer);
  rsTimer = setTimeout(()=>{ if(location.hash.startsWith("#/t/")) router(); }, 250);
});

function router(){
  const h = location.hash || "#/";
  const parts = h.replace(/^#\//,"").split("/");
  if(parts[0]==="" || parts[0]==="home"){ renderHome(); return; }
  if(parts[0]==="calc"){ renderCalc(); return; }
  if(parts[0]==="t"){
    const i = parseInt(parts[1],10);
    const kw = parts[2]||"";
    if(!isNaN(i) && i>=0 && i<DATA.length){ renderTable(i, kw); return; }
  }
  renderHome();
}

window.addEventListener("hashchange", router);
if(document.readyState!=="loading") router();
else window.addEventListener("DOMContentLoaded", router);
</script>
</body>
</html>
